spring:
  application:
    name: mediconnect-backend

  # ── Default / dev profile (H2 – no installation required) ──────────────
  datasource:
    url: jdbc:h2:file:./data/mediconnect-dev;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update        # auto-creates / updates tables from entities
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# ── JWT Configuration ────────────────────────────────────────────────────
app:
  jwt:
    secret: "MediaConnectSuperSecretKeyForHS256JWTSigningNeedsToBeAtLeast32Chars"
    expiration-ms: 86400000   # 24 hours

# ── SpringDoc / Swagger ──────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

---
# ── PostgreSQL profile (activate with: --spring.profiles.active=postgres) ─
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/mediconnect
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: false
